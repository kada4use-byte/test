name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -o project.zip -d build_src
      - name: Build APK
        working-directory: build_src
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Forest Bot APK ${{ github.run_number }}
          files: build_src/app/build/outputs/apk/debug/app-debug.apk
